<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stuck in the Rooms</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // level
        const loader = new GLTFLoader();

        loader.load(
            'models/level1.glb',

            (gltf) => {
                const level = gltf.scene;

                scene.add(level);

                console.log("Level loaded!", level);
            },

            undefined,

            (error) => {
                console.error("LEVEL FAILED TO LOAD:", error);
            }
        );

        // lights
        const light = new THREE.AmbientLight(0xeed299, 0.2);
        scene.add(light);

        // flashlight
        const flashlight = new THREE.SpotLight(0xffffff, 6, 15, Math.PI / 5, 0.6, 1);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // player spawn
        camera.position.set(3, 1.6, 3);
        const controls = new PointerLockControls(camera, document.body);

        document.body.addEventListener('click', () => {
            controls.lock();
        });


        // detect wasd
        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        const moveSpeed = 0.06;

        function animate() {
            requestAnimationFrame(animate);
            
            // movement
            if (keys.w) controls.moveForward(moveSpeed);
            if (keys.s) controls.moveForward(-moveSpeed);
            if (keys.a) controls.moveRight(-moveSpeed);
            if (keys.d) controls.moveRight(moveSpeed);

            // flashlight updating
            flashlight.position.copy(camera.position);

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            flashlight.target.position.copy(camera.position)
                .add(direction);

            flashlight.target.updateMatrixWorld();

            renderer.render(scene, camera);
        }

        // window nerdy stuff (resizing :P) (im not a nerd i sweer!!1!!1!)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
