<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stuck in the Rooms</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // level
        let level;

        const loader = new GLTFLoader();
        const raycaster = new THREE.Raycaster();

        loader.load(
            'models/level1.glb',

            (gltf) => {
                level = gltf.scene;

                level.traverse((object) => {
                    if (object.isMesh) {

                        console.log(object.name, object.material);

                        if (Array.isArray(object.material)) {
                            object.material.forEach(material => {
                                material.side = THREE.DoubleSide;
                            });
                        } else {
                            object.material.side = THREE.DoubleSide;
                        }
                    }
                });

                scene.add(level);

                console.log("Level loaded!", level);
            },

            undefined,

            (error) => {
                console.error("LEVEL FAILED TO LOAD:", error);
            }
        );

        // lights
        const levelLight = new THREE.AmbientLight(0xffffff, 10);
        scene.add(levelLight);

        // flashlight
        const flashlight = new THREE.SpotLight(0xffffff, 6, 15, Math.PI / 5, 0.6, 1);
        scene.add(flashlight);
        scene.add(flashlight.target);
        flashlight.visible = false;

        // player spawn
        camera.position.set(3, 1.6, 3);
        const controls = new PointerLockControls(camera, document.body);

        document.body.addEventListener('click', () => {
            controls.lock();
        });

        let blackout = false;
        let flashlightOn = false;

        // detect wasd
        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (key in keys) {
                keys[key] = true;
            }

            if (key === 'f' && blackout && !e.repeat) {
                flashlightOn = !flashlightOn;
                flashlight.visible = flashlightOn;
            }

            //blackout debug
            if (key === 'b') {
                startBlackout();
            }

            if (key === 'n') {
                endBlackout();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        const moveSpeed = 0.06;

        // raycaster
        function wallInDirection(direction) {
            if (!level) return false;

            direction = direction.clone();
            direction.y = 0;
            direction.normalize();

            raycaster.set(camera.position, direction);

            const hits = raycaster.intersectObject(level, true);

            return hits.length > 0 && hits[0].distance < 0.5;
        }

        function startBlackout() {
            blackout = true;

            levelLight.intensity = 0.02;

            flashlightOn = false;
            flashlight.visible = false;

            console.log("BLACKOUT!");
        }

        function endBlackout() {
            blackout = false;

            levelLight.intensity = 1.2;

            flashlightOn = false;
            flashlight.visible = false;

            console.log("Power restored");
        }

        // animation loop
        function animate() {
            requestAnimationFrame(animate);

            // figure out which way the player is facing
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);

            forward.y = 0;
            forward.normalize();

            const backward = forward.clone().negate();

            const right = new THREE.Vector3(
                -forward.z,
                0,
                forward.x
            );

            const left = right.clone().negate();

            // movement
            if (keys.w && !wallInDirection(forward))
                controls.moveForward(moveSpeed);

            if (keys.s && !wallInDirection(backward))
                controls.moveForward(-moveSpeed);

            if (keys.a && !wallInDirection(left))
                controls.moveRight(-moveSpeed);

            if (keys.d && !wallInDirection(right))
                controls.moveRight(moveSpeed);

            // flashlight updating
            flashlight.position.copy(camera.position);

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            flashlight.target.position.copy(camera.position)
                .add(direction);

            flashlight.target.updateMatrixWorld();

            renderer.render(scene, camera);
        }

        // window resizing stuff
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
